<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六面世界の創世記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: rgba(18, 20, 29, 0.85);
      --gold-accent: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.3);
      --parchment: #f4ecd8;
      --ink: #2b261f;
      --font-serif: 'Noto Serif JP', serif;
      --font-hand: 'Klee One', cursive;
      --font-en: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, #1c2333 0%, transparent 75%),
        radial-gradient(circle at 10% 90%, #151124 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, #0d1e1c 0%, transparent 50%);
      color: #e0e2ec;
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      overflow-x: hidden;
      position: relative;
    }

    .cube-dust {
      position: fixed;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      pointer-events: none;
      animation: float 16s infinite linear;
      z-index: 0;
    }
    @keyframes float {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.4; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .site-title {
      font-family: var(--font-en);
      font-size: 2.1rem;
      letter-spacing: 0.25em;
      color: #f7f3e8;
      text-shadow: 0 0 15px var(--gold-glow);
      margin-bottom: 6px;
    }

    .site-sub {
      font-size: 0.85rem;
      color: #8c93a8;
      letter-spacing: 0.15em;
    }

    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 12px;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(22, 27, 40, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #a8b0c4;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      color: #fff;
      border-color: var(--gold-accent);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(18, 20, 29, 0.9));
      color: #ffd875;
      border-color: var(--gold-accent);
      box-shadow: 0 0 14px var(--gold-glow), inset 0 0 8px rgba(212, 175, 55, 0.2);
    }

    main {
      width: 100%;
      max-width: 860px;
      position: relative;
      z-index: 1;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* タブ1: 創世記 */
    .myth-scroll {
      background: #14161f;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      padding: 40px 32px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
      position: relative;
    }

    .myth-scroll::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(212, 175, 55, 0.2);
      border-radius: 4px;
      pointer-events: none;
    }

    .myth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .myth-title {
      font-size: 1.6rem;
      color: var(--gold-accent);
      letter-spacing: 0.18em;
      margin-bottom: 6px;
    }

    .myth-body {
      font-size: 1rem;
      line-height: 2.1;
      color: #c9d0e2;
      text-align: justify;
    }

    .myth-body p {
      margin-bottom: 20px;
      text-indent: 1em;
    }

    .myth-symbol {
      text-align: center;
      margin: 30px 0 10px;
      font-size: 2rem;
      color: var(--gold-accent);
      opacity: 0.8;
    }

    /* タブ2: 日記 */
    .book-wrapper {
      perspective: 1400px;
      display: flex;
      justify-content: center;
    }

    .book {
      width: 100%;
      max-width: 820px;
      background: linear-gradient(to right, #24140b 0%, #3e2415 4%, #2b170c 8%, #201108 100%);
      padding: 18px;
      border-radius: 8px 14px 14px 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.7);
      position: relative;
    }

    .book-spread {
      display: flex;
      background: var(--parchment);
      border-radius: 4px;
      box-shadow: inset 0 0 35px rgba(138, 105, 56, 0.45);
      position: relative;
      overflow: hidden;
      min-height: 480px;
    }

    .book-spine-shadow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 44px;
      transform: translateX(-50%);
      background: linear-gradient(to right, 
        rgba(0,0,0,0.18) 0%, 
        rgba(0,0,0,0.38) 46%, 
        rgba(0,0,0,0.5) 50%, 
        rgba(0,0,0,0.38) 54%, 
        rgba(0,0,0,0.18) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .book-page {
      flex: 1;
      padding: 34px 28px;
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 1.05rem;
      line-height: 1.95;
      position: relative;
    }

    .page-left {
      border-right: 1px solid rgba(139, 90, 43, 0.2);
    }

    .diary-date {
      font-family: var(--font-hand);
      font-weight: 600;
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: #6d2a1d;
      border-bottom: 1px dashed rgba(109, 42, 29, 0.35);
      padding-bottom: 4px;
      display: inline-block;
    }

      position:
